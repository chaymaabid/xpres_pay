# xprespay/docker-compose.yml
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xprespay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xprespay
      POSTGRES_PASSWORD: xprespay_secret
      POSTGRES_MULTIPLE_DATABASES: xprespay_db,keycloak_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/create-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - xprespay_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: xprespay_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: xprespay
      KC_DB_PASSWORD: xprespay_secret
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - xprespay_net
  minio:
    image: minio/minio
    container_name: minio-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  kyc-vision:
    image: python:3.11-slim
    container_name: kyc-vision
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./kyc-vision:/app
      - kyc_pip_cache:/usr/local/lib/python3.11/site-packages
    command: bash -c "apt-get update -qq && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 curl && pip install --no-cache-dir torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r /app/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000" 
    networks:
      - xprespay_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s          
 
volumes:
  postgres_data:
  minio_data:
  kyc_pip_cache:

networks:
  xprespay_net:
    driver: bridge